name: Upstream drift
on:
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zulip:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.9'
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Report release, main and pinned schema drift
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/upstream_drift.py 2>&1 | tee "$RUNNER_TEMP/upstream-drift.txt"
      - name: Preserve drift or verification failure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-drift
          path: ${{ runner.temp }}/upstream-drift.txt
          if-no-files-found: error
          retention-days: 30
