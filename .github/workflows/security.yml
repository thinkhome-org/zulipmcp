name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.9'
          python-version: '3.12'
      - name: Audit locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt" > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip \
            --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Python static security analysis
        run: uvx --from bandit==1.9.4 bandit -r src scripts
      - name: Scan complete Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .
  security-gate:
    if: always()
    needs: [scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful security scans
        env:
          RESULT: ${{ needs.scan.result }}
        run: test "$RESULT" = success
