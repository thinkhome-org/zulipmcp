[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "thinkhome-zulip-mcp"
version = "0.1.0.dev0"
description = "Auditable Zulip application API access through MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0,<3",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
]

[project.scripts]
thinkhome-zulip-mcp = "thinkhome_zulip_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-pyyaml>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
